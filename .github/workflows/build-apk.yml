              .top-c { color:#FBBF24; }
              .bot-c { color:#FB923C; }
              canvas { width:100%; height:56px; background:#080B10; border-radius:8px; border:1px solid #1E2636; display:block; margin-top:8px; }
              button { background:#FFD400; color:#000; border:none; border-radius:10px; padding:11px; font-weight:800; width:100%; margin-top:8px; font-size:12px; cursor:pointer; }
              button.btn-blue { background:#3B82F6; color:#fff; }
              button.secondary { background:#1E293B; color:#E2E8F0; border:1px solid #334155; margin-top:6px; font-weight:600; padding:8px; }
              .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
              .stat-item { background:#0D1119; border:1px solid #1E293B; border-radius:9px; padding:7px 8px; font-size:11px; }
              .stat-label { color:#94A3B8; font-size:10px; }
              .stat-num { font-family:monospace; font-size:13px; font-weight:700; color:#F8FAFC; margin-top:2px; }
              .raw-box { background:#070A0E; border:1px solid #1E293B; border-radius:8px; padding:7px; font-family:monospace; font-size:10px; color:#94A3B8; margin-top:8px; line-height:1.4; }
            </style>
          </head>
          <body>
            <div id="chgWarnBanner" class="badge-red">
              ⚠️ 偵測到手機正在充電！充電電流會覆蓋電池放電數據，請拔除充電線以量測真實功耗。
            </div>

            <div class="card">
              <div class="row-between">
                <strong style="font-size:14px;">POCO F8 Ultra 真實外放功耗儀 v3.0</strong>
                <span class="badge" id="micSrcBadge">48kHz 原音直採</span>
              </div>
              <p style="font-size:10px;color:#94A3B8;margin:4px 0 0;">
                專為 Poweramp EQ (全域等化 / AIDL 模式 1 / 16384 區塊) 打造：零假動畫，100% 讀取真實麥克風聲壓與 PMIC 原始電流
              </p>
            </div>

            <!-- Card 1: Real 48kHz UNPROCESSED Acoustic Crossover Meter -->
            <div class="card">
              <div class="row-between">
                <span style="font-size:11px;color:#94A3B8;">真實物理聲波推算喇叭功耗 (含 Poweramp EQ 增益)</span>
                <span class="badge-green" id="dbBadge">-90.0 dBFS</span>
              </div>
              <div class="row-between" style="margin-top:5px;align-items:baseline;">
                <div class="val-giant"><span id="totalMw">0</span> <span style="font-size:14px;">mW</span></div>
                <div style="text-align:right;font-size:10px;color:#94A3B8;font-family:monospace;">
                  系統音量: <strong id="volLabel" style="color:#FFD400;">--%</strong> | 校準: <strong id="calLabel" style="color:#34D399;">1.00x</strong>
                </div>
              </div>

              <div class="grid-3">
                <div class="unit-box">
                  <div class="unit-title">頂部 1115F (>220Hz)</div>
                  <div class="unit-val top-c" id="topMw">0 mW</div>
                </div>
                <div class="unit-box" style="border-color:rgba(96,165,250,0.4);">
                  <div class="unit-title">1620 重低音 (≤220Hz)</div>
                  <div class="unit-val sub-c" id="subMw">0 mW</div>
                </div>
