name: Build POCO F8 Ultra Speaker Power APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign Android APK v4.0
        run: |
          python3 - << 'PY'
          import subprocess
          raw = ""
          for rev in [f"HEAD~{i}" for i in range(1, 50)]:
              try:
                  txt = subprocess.check_output(["git", "show", f"{rev}:.github/workflows/build-apk.yml"]).decode("utf-8")
                  if "package com.poco" in txt and "N * 0.12" in txt:
                      raw = txt
                      break
              except Exception:
                  pass
          assert raw, "Base v3 commit not found"
          s = raw.split("python3 - << 'PY'\n", 1)[1].split("\n          PY", 1)[0]
          code = "\n".join(l[10:] if l.startswith("          ") else l for l in s.splitlines())
          code = code.replace(
              "double mag = Math.sqrt(q1 * q1 + q2 * q2 - q1 * q2 * coeff) / (N * 0.12);\n                                          double norm = Math.min(1.0, Math.pow(Math.max(0.0, mag), 0.55));",
              "double mag = Math.sqrt(q1 * q1 + q2 * q2 - q1 * q2 * coeff) / (N * 0.005);\n                                          if (b < 7) mag *= 2.8;\n                                          double norm = Math.max(0.05, Math.min(1.0, (20.0 * Math.log10(Math.max(1e-5, mag)) + 52.0) / 48.0));"
          )
          code = code.replace("Math.pow(vNorm, 2.2)", "1.0")
          code = code.replace("0.2 + midScale", "midScale").replace("0.2 + lowScale", "lowScale * 2.6")
          code = code.replace(
              "if (idleMa !== null) {",
              "const avgNow = parseFloat(document.getElementById('totalMw').textContent) || 180;\n                    if (spkMw > 20 && avgNow > 20) { calFactor = Math.max(0.15, Math.min(3.5, spkMw / (avgNow / calFactor))); document.getElementById('calLabel').textContent = calFactor.toFixed(2) + 'x'; }\n                    if (idleMa !== null) {"
          )
          code = code.replace("v3.0", "v7.0").replace("v3", "v7")
          exec(code, {"__name__": "__main__"})
          PY

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF8Ultra-SpeakerPower-APK-v7
          path: dist/*.apk
