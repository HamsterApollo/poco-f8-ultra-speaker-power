name: Build POCO F8 Ultra Speaker Power APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign Android APK Directly
        run: |
          python3 - << 'PY'
          import glob, os, subprocess, zipfile

          sdk = os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
          build_tools_list = sorted(glob.glob(f"{sdk}/build-tools/*"))
          platforms_list = sorted(glob.glob(f"{sdk}/platforms/android-*/android.jar"))
          assert build_tools_list, f"No build-tools in {sdk}"
          assert platforms_list, f"No platforms in {sdk}"

          bt = build_tools_list[-1]
          android_jar = platforms_list[-1]
          print("Using build-tools:", bt)
          print("Using android.jar:", android_jar)

          aapt2 = os.path.join(bt, "aapt2")
          d8 = os.path.join(bt, "d8")
          zipalign = os.path.join(bt, "zipalign")
          apksigner = os.path.join(bt, "apksigner")

          os.makedirs("src/com/poco/f8ultra/speakerpower", exist_ok=True)
          os.makedirs("res/values", exist_ok=True)
          os.makedirs("assets", exist_ok=True)
          os.makedirs("gen", exist_ok=True)
          os.makedirs("obj", exist_ok=True)
          os.makedirs("dist", exist_ok=True)

          with open("AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.poco.f8ultra.speakerpower"
              android:versionCode="1"
              android:versionName="1.0.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="POCO F8 Ultra 喇叭功耗儀"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''.strip())

          with open("res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">POCO F8 Ultra 喇叭功耗儀</string>
          </resources>'''.strip())

          with open("src/com/poco/f8ultra/speakerpower/MainActivity.java", "w", encoding="utf-8") as f:
              f.write('''package com.poco.f8ultra.speakerpower;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.os.BatteryManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private BatteryManager batteryManager;
              private AudioManager audioManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));
                  batteryManager = (BatteryManager) getSystemService(Context.BATTERY_SERVICE);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AndroidHardwareBridge(), "AndroidBridge");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidHardwareBridge {
                  @JavascriptInterface
                  public double getBatteryCurrentMa() {
                      int rawUa = batteryManager.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW);
                      double absVal = Math.abs((double) rawUa);
                      return absVal > 10000.0 ? absVal / 1000.0 : absVal;
                  }
                  @JavascriptInterface
                  public int getBatteryVoltageMv() {
                      Intent intent = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      return intent != null ? intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 3880) : 3880;
                  }
                  @JavascriptInterface
                  public int getMusicVolumePct() {
                      int cur = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                      int max = Math.max(1, audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                      return (int) Math.round((cur * 100.0) / max);
                  }
              }
          }'''.strip())

          with open("assets/index.html", "w", encoding="utf-8") as f:
              f.write('''<!DOCTYPE html>
          <html lang="zh-Hant">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>POCO F8 Ultra 2.1 外放功耗監測儀</title>
            <style>
              body { background:#0B0E14; color:#F3F4F6; font-family:system-ui,sans-serif; margin:0; padding:16px; }
              .card { background:#131822; border:1px solid #222B3B; border-radius:16px; padding:16px; margin-bottom:14px; }
              .badge { background:#FFD400; color:#000; font-weight:800; padding:3px 8px; border-radius:99px; font-size:11px; }
              .val { font-size:32px; font-weight:800; color:#FFD400; font-family:monospace; margin-top:4px; }
              .sub { color:#60A5FA; font-weight:700; font-family:monospace; }
              .stereo { color:#F59E0B; font-weight:700; font-family:monospace; }
              button { background:#FFD400; color:#000; border:none; border-radius:10px; padding:12px 14px; font-weight:700; width:100%; margin-top:10px; font-size:14px; }
              input[type=range] { width:100%; accent-color:#FFD400; margin-top:6px; }
              select { width:100%; background:#0B0E14; color:#fff; border:1px solid #222B3B; border-radius:8px; padding:8px; margin-top:6px; }
            </style>
          </head>
          <body>
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong>POCO F8 Ultra 2.1 外放功耗儀</strong>
                <span class="badge" id="modeBadge">Sound by Bose</span>
              </div>
              <p style="font-size:12px;color:#94A3B8;margin:6px 0 0;">雙 1115F 對稱立體聲 + 1620 獨立重低音 + PMIC 硬體差值實測</p>
            </div>
            <div class="card">
              <div style="font-size:12px;color:#94A3B8;">2.1 聲學模型即時估算喇叭總功耗</div>
              <div class="val"><span id="totalMw">485</span> mW</div>
              <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:13px;">
                <span>1620 重低音: <span class="sub" id="subMw">245 mW</span></span>
                <span>雙 1115F: <span class="stereo" id="stereoMw">240 mW</span></span>
              </div>
              <div style="margin-top:12px;font-size:12px;color:#CBD5E1;">
                HyperOS 系統媒體音量: <strong id="volLabel">73%</strong>
                <input id="volSlider" type="range" min="0" max="100" value="73">
              </div>
              <div style="margin-top:10px;font-size:12px;color:#CBD5E1;">
                Bose 調音模式:
                <select id="profileSel">
                  <option value="bose_dyn">Bose Dynamic (重低音強化)</option>
                  <option value="bose_bal">Bose Balanced (均衡原音)</option>
                  <option value="stereo_only">關閉 1620 重低音 (僅雙 1115F)</option>
                </select>
              </div>
            </div>
            <div class="card">
              <div style="font-size:12px;color:#94A3B8;">PMIC 硬體電池直連差值實測 (BatteryManager)</div>
              <div style="margin-top:8px;font-size:13px;">
                整機放電電流: <strong id="curMa">--</strong> mA | 電壓: <strong id="voltMv">3880</strong> mV
              </div>
              <div style="margin-top:6px;font-size:13px;">
                0% 靜音基準電流: <strong id="baseMa">未鎖定</strong>
              </div>
              <div style="margin-top:6px;font-size:14px;">
                實測純喇叭外放淨功耗: <strong style="color:#FFD400;font-size:20px;font-family:monospace;" id="diffMw">-- mW</strong>
              </div>
              <button id="lockBtn">鎖定當前電流為 0% 靜音基準</button>
            </div>
            <script>
              let baselineMa = null;
              let lastCurrentMa = 310;
              const slider = document.getElementById('volSlider');
              const profileSel = document.getElementById('profileSel');
              document.getElementById('lockBtn').onclick = () => {
                baselineMa = lastCurrentMa;
                document.getElementById('baseMa').textContent = baselineMa.toFixed(1) + ' mA';
              };
              setInterval(() => {
                let vol = parseInt(slider.value, 10) || 0;
                let volt = 3880;
                if (window.AndroidBridge) {
                  try {
                    vol = window.AndroidBridge.getMusicVolumePct();
                    slider.value = vol;
                    lastCurrentMa = window.AndroidBridge.getBatteryCurrentMa();
                    volt = window.AndroidBridge.getBatteryVoltageMv();
                    document.getElementById('modeBadge').textContent = 'PMIC 硬體直連';
                  } catch (e) {}
                }
                document.getElementById('volLabel').textContent = vol + '%';
                const vNorm = vol / 100.0;
                const prof = profileSel.value;
                const idle = vol > 0 ? (prof === 'stereo_only' ? 32 : 48) : 0;
                const stereo = Math.round(idle * 0.6 + 460 * Math.pow(vNorm, 2.4));
                const subMult = prof === 'stereo_only' ? 0 : (prof === 'bose_bal' ? 0.85 : 1.15);
                const sub = Math.round((idle * 0.4 + 580 * Math.pow(vNorm, 2.55)) * subMult);
                const total = stereo + sub;
                document.getElementById('totalMw').textContent = total;
                document.getElementById('subMw').textContent = sub + ' mW';
                document.getElementById('stereoMw').textContent = stereo + ' mW';
                document.getElementById('curMa').textContent = lastCurrentMa.toFixed(1);
                document.getElementById('voltMv').textContent = volt;
                if (baselineMa !== null) {
                  const diff = Math.max(0, lastCurrentMa - baselineMa) * (volt / 1000.0);
                  document.getElementById('diffMw').textContent = Math.round(diff) + ' mW';
                }
              }, 400);
            </script>
          </body>
          </html>'''.strip())

          subprocess.check_call([aapt2, "compile", "--dir", "res", "-o", "res.zip"])
          subprocess.check_call([
              aapt2, "link", "-o", "unsigned.apk",
              "-I", android_jar,
              "--manifest", "AndroidManifest.xml",
              "-A", "assets",
              "--java", "gen",
              "res.zip"
          ])

          java_files = glob.glob("gen/**/*.java", recursive=True) + glob.glob("src/**/*.java", recursive=True)
          subprocess.check_call(["javac", "-source", "11", "-target", "11", "-cp", android_jar, "-d", "obj"] + java_files)

          class_files = glob.glob("obj/**/*.class", recursive=True)
          subprocess.check_call([d8, "--lib", android_jar, "--output", "."] + class_files)

          with zipfile.ZipFile("unsigned.apk", "a") as zf:
              zf.write("classes.dex", "classes.dex", compress_type=zipfile.ZIP_STORED)

          subprocess.check_call([zipalign, "-f", "-p", "4", "unsigned.apk", "aligned.apk"])
          subprocess.check_call([
              "keytool", "-genkeypair", "-v",
              "-keystore", "debug.keystore",
              "-storepass", "android",
              "-alias", "androiddebugkey",
              "-keypass", "android",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-dname", "CN=Android Debug,O=Android,C=US"
          ])
          out_apk = "dist/PocoF8Ultra-SpeakerPower.apk"
          subprocess.check_call([
              apksigner, "sign",
              "--ks", "debug.keystore",
              "--ks-pass", "pass:android",
              "--key-pass", "pass:android",
              "--out", out_apk,
              "aligned.apk"
          ])
          subprocess.check_call([apksigner, "verify", "-v", out_apk])
          print("APK successfully built and verified:", out_apk)
          PY

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF8Ultra-SpeakerPower-APK
          path: dist/*.apk
