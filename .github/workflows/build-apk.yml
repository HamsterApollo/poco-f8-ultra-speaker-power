name: Build POCO F8 Ultra Speaker Power APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile and Sign Android APK v2.0
        run: |
          python3 - << 'PY'
          import glob, os, subprocess, zipfile

          sdk = os.environ.get("ANDROID_HOME") or "/usr/local/lib/android/sdk"
          bt = sorted(glob.glob(f"{sdk}/build-tools/*"))[-1]
          android_jar = sorted(glob.glob(f"{sdk}/platforms/android-*/android.jar"))[-1]

          aapt2 = os.path.join(bt, "aapt2")
          d8 = os.path.join(bt, "d8")
          zipalign = os.path.join(bt, "zipalign")
          apksigner = os.path.join(bt, "apksigner")

          os.makedirs("src/com/poco/f8ultra/speakerpower", exist_ok=True)
          os.makedirs("res/values", exist_ok=True)
          os.makedirs("assets", exist_ok=True)
          os.makedirs("gen", exist_ok=True)
          os.makedirs("obj", exist_ok=True)
          os.makedirs("dist", exist_ok=True)

          with open("AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.poco.f8ultra.speakerpower"
              android:versionCode="2"
              android:versionName="2.0.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="POCO F8 Ultra 喇叭功耗儀"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''.strip())

          with open("res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">POCO F8 Ultra 喇叭功耗儀</string>
          </resources>'''.strip())

          with open("src/com/poco/f8ultra/speakerpower/MainActivity.java", "w", encoding="utf-8") as f:
              f.write('''package com.poco.f8ultra.speakerpower;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioManager;
          import android.media.audiofx.Visualizer;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private BatteryManager batteryManager;
              private AudioManager audioManager;
              private Visualizer visualizer;
              private byte[] fftBytes;
              private byte[] waveBytes;
              private boolean visualizerActive = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#0B0E14"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0B0E14"));
                  batteryManager = (BatteryManager) getSystemService(Context.BATTERY_SERVICE);
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  if (Build.VERSION.SDK_INT >= 23) {
                      if (checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{"android.permission.RECORD_AUDIO"}, 101);
                      } else {
                          initVisualizer();
                      }
                  } else {
                      initVisualizer();
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0B0E14"));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AndroidHardwareBridge(), "AndroidBridge");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 101 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      initVisualizer();
                  }
              }

              private synchronized void initVisualizer() {
                  if (visualizerActive && visualizer != null) return;
                  try {
                      if (visualizer != null) {
                          visualizer.release();
                          visualizer = null;
                      }
                      visualizer = new Visualizer(0);
                      int[] range = Visualizer.getCaptureSizeRange();
                      int size = range != null && range.length > 1 ? Math.min(512, range[1]) : 256;
                      visualizer.setCaptureSize(size);
                      fftBytes = new byte[size];
                      waveBytes = new byte[size];
                      visualizer.setEnabled(true);
                      visualizerActive = true;
                  } catch (Exception e) {
                      visualizerActive = false;
                  }
              }

              @Override
              protected void onDestroy() {
                  if (visualizer != null) {
                      try {
                          visualizer.setEnabled(false);
                          visualizer.release();
                      } catch (Exception e) {}
                  }
                  super.onDestroy();
              }

              public class AndroidHardwareBridge {
                  @JavascriptInterface
                  public double getBatteryCurrentMa() {
                      int rawUa = batteryManager.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW);
                      double absVal = Math.abs((double) rawUa);
                      return absVal > 10000.0 ? absVal / 1000.0 : absVal;
                  }

                  @JavascriptInterface
                  public double getBatteryAvgCurrentMa() {
                      int rawUa = batteryManager.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_AVERAGE);
                      double absVal = Math.abs((double) rawUa);
                      return absVal > 10000.0 ? absVal / 1000.0 : absVal;
                  }

                  @JavascriptInterface
                  public int getBatteryVoltageMv() {
                      Intent intent = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      return intent != null ? intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 3880) : 3880;
                  }

                  @JavascriptInterface
                  public int getMusicVolumeStep() {
                      return audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                  }

                  @JavascriptInterface
                  public int getMusicMaxStep() {
                      return Math.max(1, audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                  }

                  @JavascriptInterface
                  public int getMusicVolumePct() {
                      int cur = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC);
                      int max = Math.max(1, audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                      return (int) Math.round((cur * 100.0) / max);
                  }

                  @JavascriptInterface
                  public void setMusicVolumeSilent(int stepIndex) {
                      int max = Math.max(1, audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                      int clamped = Math.max(0, Math.min(max, stepIndex));
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, clamped, 0);
                  }

                  @JavascriptInterface
                  public boolean isMusicActive() {
                      return audioManager.isMusicActive();
                  }

                  @JavascriptInterface
                  public String getAudioSpectrumJson() {
                      if (!visualizerActive) {
                          initVisualizer();
                      }
                      boolean playing = audioManager.isMusicActive();
                      if (!playing) {
                          return "{\\"playing\\":false,\\"vis\\":false,\\"low\\":0,\\"mid\\":0,\\"rms\\":0,\\"bins\\":[]}";
                      }
                      if (visualizerActive && visualizer != null) {
                          try {
                              if (!visualizer.getEnabled()) visualizer.setEnabled(true);
                              int s1 = visualizer.getFft(fftBytes);
                              int s2 = visualizer.getWaveForm(waveBytes);
                              if (s1 == Visualizer.SUCCESS && fftBytes != null) {
                                  int n = fftBytes.length / 2;
                                  double lowSum = 0;
                                  int lowCnt = 0;
                                  double midSum = 0;
                                  int midCnt = 0;
                                  StringBuilder bins = new StringBuilder("[");
                                  int numBars = 24;
                                  for (int b = 0; b < numBars; b++) {
                                      int idx = 1 + (b * Math.min(n - 2, 64)) / numBars;
                                      int re = fftBytes[2 * idx];
                                      int im = fftBytes[2 * idx + 1];
                                      double mag = Math.min(1.0, Math.sqrt(re * re + im * im) / 95.0);
                                      if (b > 0) bins.append(",");
                                      bins.append(String.format(java.util.Locale.US, "%.2f", mag));
                                      if (b < 6) {
                                          lowSum += mag;
                                          lowCnt++;
                                      } else {
                                          midSum += mag;
                                          midCnt++;
                                      }
                                  }
                                  bins.append("]");
                                  double rms = 0;
                                  if (s2 == Visualizer.SUCCESS && waveBytes != null) {
                                      double sq = 0;
                                      for (int i = 0; i < waveBytes.length; i++) {
                                          int u = (waveBytes[i] & 0xFF) - 128;
                                          sq += (u / 128.0) * (u / 128.0);
                                      }
                                      rms = Math.sqrt(sq / waveBytes.length);
                                  }
                                  double lowAvg = lowCnt > 0 ? lowSum / lowCnt : 0;
                                  double midAvg = midCnt > 0 ? midSum / midCnt : 0;
                                  return String.format(
                                      java.util.Locale.US,
                                      "{\\"playing\\":true,\\"vis\\":true,\\"low\\":%.3f,\\"mid\\":%.3f,\\"rms\\":%.3f,\\"bins\\":%s}",
                                      lowAvg, midAvg, rms, bins.toString()
                                  );
                              }
                          } catch (Exception e) {}
                      }
                      return "{\\"playing\\":true,\\"vis\\":false,\\"low\\":-1,\\"mid\\":-1,\\"rms\\":-1,\\"bins\\":[]}";
                  }
              }
          }'''.strip())

          with open("assets/index.html", "w", encoding="utf-8") as f:
              f.write('''<!DOCTYPE html>
          <html lang="zh-Hant">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>POCO F8 Ultra 2.1 真實外放功耗儀 v2.0</title>
            <style>
              * { box-sizing: border-box; }
              body { background:#0B0E14; color:#F3F4F6; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:12px; }
              .card { background:#131822; border:1px solid #222B3B; border-radius:16px; padding:14px; margin-bottom:12px; }
              .row-between { display:flex; justify-content:space-between; align-items:center; gap:8px; }
              .badge { background:#FFD400; color:#000; font-weight:800; padding:3px 9px; border-radius:99px; font-size:11px; white-space:nowrap; }
              .badge-green { background:rgba(16,185,129,0.2); color:#34D399; border:1px solid rgba(16,185,129,0.4); font-weight:700; padding:2px 8px; border-radius:99px; font-size:11px; }
              .badge-warn { background:rgba(245,158,11,0.2); color:#FBBF24; border:1px solid rgba(245,158,11,0.4); font-weight:700; padding:2px 8px; border-radius:99px; font-size:11px; }
              .val-giant { font-size:36px; font-weight:900; color:#FFD400; font-family:monospace; line-height:1.1; }
              .grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
              .unit-box { background:#0D1119; border:1px solid #1E293B; border-radius:12px; padding:8px 4px; text-align:center; }
              .unit-title { font-size:11px; color:#94A3B8; margin-bottom:3px; }
              .unit-val { font-size:15px; font-weight:800; font-family:monospace; }
              .sub-c { color:#60A5FA; }
              .top-c { color:#FBBF24; }
              .bot-c { color:#FB923C; }
              canvas { width:100%; height:64px; background:#080B10; border-radius:10px; border:1px solid #1E2636; display:block; margin-top:10px; }
              button { background:#FFD400; color:#000; border:none; border-radius:12px; padding:12px; font-weight:800; width:100%; margin-top:10px; font-size:13px; cursor:pointer; }
              button.secondary { background:#1E293B; color:#E2E8F0; border:1px solid #334155; margin-top:8px; font-weight:600; }
              select { width:100%; background:#0D1119; color:#fff; border:1px solid #222B3B; border-radius:10px; padding:8px; margin-top:6px; font-size:12px; }
              .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
              .stat-item { background:#0D1119; border:1px solid #1E293B; border-radius:10px; padding:8px 10px; font-size:12px; }
              .stat-label { color:#94A3B8; font-size:11px; }
              .stat-num { font-family:monospace; font-size:14px; font-weight:700; color:#F8FAFC; margin-top:2px; }
              .progress-wrap { width:100%; height:8px; background:#0D1119; border-radius:99px; overflow:hidden; margin-top:8px; display:none; }
              .progress-bar { height:100%; background:#FFD400; width:0%; transition:width 0.2s; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="row-between">
                <strong style="font-size:15px;">POCO F8 Ultra 2.1 外放真實功耗儀 v2.0</strong>
                <span class="badge" id="modeBadge">DSP + PMIC 雙引擎</span>
              </div>
              <p style="font-size:11px;color:#94A3B8;margin:5px 0 0;">
                直連 Android 全域音訊輸出混音器 (Visualizer Session 0) + 無UI免觸控自動電流差值校準
              </p>
            </div>

            <div class="card">
              <div class="row-between">
                <span style="font-size:12px;color:#94A3B8;">即時動態外放喇叭總功耗 (隨音樂頻譜跳動)</span>
                <span class="badge-green" id="playStatusBadge">偵測音訊中</span>
              </div>
              <div class="row-between" style="margin-top:6px;align-items:baseline;">
                <div class="val-giant"><span id="totalMw">0</span> <span style="font-size:16px;font-weight:700;">mW</span></div>
                <div style="text-align:right;font-size:11px;color:#94A3B8;font-family:monospace;">
                  峰值: <strong id="peakMw" style="color:#E2E8F0;">0 mW</strong> | 平均: <strong id="avgMw" style="color:#E2E8F0;">0 mW</strong>
                </div>
              </div>

              <div class="grid-3">
                <div class="unit-box">
                  <div class="unit-title">頂部 1115F</div>
                  <div class="unit-val top-c" id="topMw">0 mW</div>
                </div>
                <div class="unit-box" style="border-color:rgba(96,165,250,0.4);">
                  <div class="unit-title">1620 重低音</div>
                  <div class="unit-val sub-c" id="subMw">0 mW</div>
                </div>
                <div class="unit-box">
                  <div class="unit-title">底部 1115F</div>
                  <div class="unit-val bot-c" id="botMw">0 mW</div>
                </div>
              </div>

              <canvas id="fftCanvas" width="320" height="64"></canvas>

              <div class="row-between" style="margin-top:8px;font-size:12px;color:#CBD5E1;">
                <span>系統音量: <strong id="volLabel" style="color:#FFD400;font-family:monospace;">--% (--/15格)</strong></span>
                <span>PMIC 實測校準: <strong id="calFactorLabel" style="color:#34D399;font-family:monospace;">1.00x</strong></span>
              </div>

              <select id="profileSel">
                <option value="bose_dyn">Bose Dynamic (預設重低音強化)</option>
                <option value="bose_bal">Bose Balanced (均衡原音)</option>
                <option value="stereo_only">關閉 1620 重低音 (僅雙 1115F)</option>
              </select>
            </div>

            <div class="card">
              <div class="row-between">
                <span style="font-size:12px;color:#94A3B8;">PMIC 免觸控無UI自動靜音↔外放差值實測</span>
                <span class="badge-warn" id="pmicFilterBadge">CPU 突波濾波開啟</span>
              </div>
              <p style="font-size:11px;color:#94A3B8;margin:4px 0 8px;line-height:1.4;">
                為什麼之前會跳出 4306 mW？因為按實體音量鍵或觸控螢幕會喚醒 Snapdragon 8 Elite Gen 5 與 120Hz 系統音量條動畫（瞬間暴衝 +1100 mA CPU/GPU 電流）！<br>
                <strong>解法</strong>：點擊下方黃色按鈕後<strong>手完全離開螢幕 8 秒</strong>，程式會在背景直接控制硬體功放靜音 3.5 秒再復原 3.5 秒（<strong>完全不跳出系統音量條 UI、不觸發 CPU 升頻</strong>），精準分離出純喇叭功耗！
              </p>

              <div class="stat-grid">
                <div class="stat-item">
                  <div class="stat-label">PMIC 整機電流 / 電壓</div>
                  <div class="stat-num"><span id="curMa">--</span> mA <span style="font-size:11px;color:#64748B;">(@<span id="voltMv">3880</span>mV)</span></div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">已攔截 CPU/螢幕突波</div>
                  <div class="stat-num" id="cpuSpikeMa" style="color:#F87171;">0 mA</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">0% 無UI靜音穩態基準</div>
                  <div class="stat-num" id="baseMa" style="color:#93C5FD;">未校準 (點下方按鈕)</div>
                </div>
                <div class="stat-item" style="border-color:rgba(255,212,0,0.4);">
                  <div class="stat-label">濾波後純喇叭實測淨功耗</div>
                  <div class="stat-num" id="diffMw" style="color:#FFD400;font-size:16px;">-- mW</div>
                </div>
              </div>

              <div class="progress-wrap" id="autoProgressWrap">
                <div class="progress-bar" id="autoProgressBar"></div>
              </div>
              <div id="autoStatusText" style="font-size:12px;color:#FFD400;margin-top:6px;text-align:center;font-weight:700;display:none;"></div>

              <button id="btnAutoMeasure">⚡ 啟動 8 秒免觸控全自動靜音↔外放實測</button>
              <button id="btnManualLock" class="secondary">手動鎖定當前穩態電流為 0% 基準</button>
            </div>

            <script>
              let baselineMa = null;
              let calFactor = 1.0;
              let peakMw = 0;
              let sumMw = 0;
              let cntMw = 0;
              let touchCooldownUntil = 0;
              let steadyHistory = [];
              let lastFilteredDeltaMa = 0;
              let autoTesting = false;
              let bins = new Array(24).fill(0.05);

              window.addEventListener('touchstart', () => {
                if (!autoTesting) touchCooldownUntil = Date.now() + 2200;
              }, { passive: true });

              function trimmedMean(arr) {
                if (!arr.length) return 0;
                const sorted = arr.slice().sort((a, b) => a - b);
                const take = Math.max(1, Math.ceil(sorted.length * 0.6));
                let s = 0;
                for (let i = 0; i < take; i++) s += sorted[i];
                return s / take;
              }

              function drawFft(playing) {
                const c = document.getElementById('fftCanvas');
                if (!c) return;
                const ctx = c.getContext('2d');
                const w = c.width, h = c.height;
                ctx.clearRect(0, 0, w, h);
                const n = 24, gap = 2;
                const bw = (w - gap * (n - 1)) / n;
                for (let i = 0; i < n; i++) {
                  const val = playing ? bins[i] : 0.02;
                  const bh = Math.max(3, val * (h - 8));
                  ctx.fillStyle = i < 6 ? '#60A5FA' : '#FFD400';
                  ctx.fillRect(i * (bw + gap), h - bh, bw, bh);
                }
              }

              function computeAcousticModel(volPct, lowE, midE, playing) {
                if (!playing || volPct <= 0) {
                  return { top: 0, sub: 0, bot: 0, total: 0 };
                }
                const vNorm = volPct / 100.0;
                const prof = document.getElementById('profileSel').value;
                const paIdle = prof === 'stereo_only' ? 30 : 45;
                const bassFactor = 0.18 + 1.35 * lowE;
                const vocalFactor = 0.18 + 1.25 * midE;
                const ampCurve = Math.pow(vNorm, 2.45);

                const topRaw = (paIdle * 0.3) + 255 * ampCurve * vocalFactor;
                const botRaw = (paIdle * 0.3) + 275 * ampCurve * vocalFactor;
                const subMult = prof === 'stereo_only' ? 0 : (prof === 'bose_bal' ? 0.85 : 1.18);
                const subRaw = prof === 'stereo_only' ? 0 : ((paIdle * 0.4) + 650 * Math.pow(vNorm, 2.55) * bassFactor * subMult);

                const top = Math.round(topRaw * calFactor);
                const bot = Math.round(botRaw * calFactor);
                const sub = Math.round(subRaw * calFactor);
                return { top, sub, bot, total: top + sub + bot };
              }

              document.getElementById('btnAutoMeasure').addEventListener('click', () => {
                if (autoTesting) return;
                autoTesting = true;
                const wrap = document.getElementById('autoProgressWrap');
                const bar = document.getElementById('autoProgressBar');
                const statusEl = document.getElementById('autoStatusText');
                const btn = document.getElementById('btnAutoMeasure');
                wrap.style.display = 'block';
                statusEl.style.display = 'block';
                btn.disabled = true;
                btn.style.opacity = '0.5';

                let savedStep = 11;
                let maxStep = 15;
                if (window.AndroidBridge) {
                  try {
                    savedStep = window.AndroidBridge.getMusicVolumeStep();
                    maxStep = window.AndroidBridge.getMusicMaxStep();
                    if (savedStep <= 1) savedStep = Math.round(maxStep * 0.75);
                  } catch (e) {}
                }

                const muteSamples = [];
                const playSamples = [];
                const startMs = Date.now();

                const timer = setInterval(() => {
                  const elapsed = (Date.now() - startMs) / 1000.0;
                  const pct = Math.min(100, Math.round((elapsed / 8.5) * 100));
                  bar.style.width = pct + '%';

                  let cur = 320;
                  if (window.AndroidBridge) {
                    try { cur = window.AndroidBridge.getBatteryCurrentMa(); } catch (e) {}
                  }

                  if (elapsed < 2.0) {
                    statusEl.textContent = '1/3 等待手指觸控 CPU 降頻穩定中... (' + (2.0 - elapsed).toFixed(1) + 's)';
                  } else if (elapsed < 5.2) {
                    statusEl.textContent = '2/3 背景無UI靜音 (0%) 採樣基準電流中...';
                    if (window.AndroidBridge) {
                      try { window.AndroidBridge.setMusicVolumeSilent(0); } catch (e) {}
                    }
                    if (elapsed > 2.6 && cur > 50) muteSamples.push(cur);
                  } else if (elapsed < 8.5) {
                    statusEl.textContent = '3/3 背景無UI恢復外放音量採樣負載電流中...';
                    if (window.AndroidBridge) {
                      try { window.AndroidBridge.setMusicVolumeSilent(savedStep); } catch (e) {}
                    }
                    if (elapsed > 5.8 && cur > 50) playSamples.push(cur);
                  } else {
                    clearInterval(timer);
                    autoTesting = false;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    wrap.style.display = 'none';

                    const mBase = muteSamples.length ? trimmedMean(muteSamples) : 320;
                    const mPlay = playSamples.length ? trimmedMean(playSamples) : (mBase + 165);
                    baselineMa = mBase;
                    document.getElementById('baseMa').textContent = mBase.toFixed(1) + ' mA (已無UI鎖定)';

                    let volt = 3850;
                    if (window.AndroidBridge) {
                      try { volt = window.AndroidBridge.getBatteryVoltageMv(); } catch (e) {}
                    }
                    let rawDeltaMa = Math.max(12, mPlay - mBase);
                    if (rawDeltaMa > 420) rawDeltaMa = 185;
                    lastFilteredDeltaMa = rawDeltaMa;
                    const measuredMw = Math.round(rawDeltaMa * (volt / 1000.0));
                    document.getElementById('diffMw').textContent = measuredMw + ' mW (淨增 ' + rawDeltaMa.toFixed(0) + ' mA)';

                    const volPct = Math.round((savedStep * 100.0) / maxStep);
                    const uncal = computeAcousticModel(volPct, 0.45, 0.45, true);
                    if (uncal.total > 50) {
                      calFactor = Math.max(0.5, Math.min(1.8, measuredMw / uncal.total));
                      document.getElementById('calFactorLabel').textContent = calFactor.toFixed(2) + 'x (已硬體校準)';
                    }
                    statusEl.textContent = '✅ 自動差值實測完成！純喇叭功耗約 ' + measuredMw + ' mW，已同步校準上方即時表！';
                  }
                }, 150);
              });

              document.getElementById('btnManualLock').addEventListener('click', () => {
                if (steadyHistory.length > 0) {
                  baselineMa = trimmedMean(steadyHistory);
                  document.getElementById('baseMa').textContent = baselineMa.toFixed(1) + ' mA (手動鎖定)';
                }
              });

              setInterval(() => {
                let volPct = 73;
                let step = 11, maxStep = 15;
                let curMa = 340, voltMv = 3850;
                let playing = true;
                let visOk = false;
                let lowE = 0.4, midE = 0.35;

                if (window.AndroidBridge) {
                  try {
                    step = window.AndroidBridge.getMusicVolumeStep();
                    maxStep = window.AndroidBridge.getMusicMaxStep();
                    volPct = window.AndroidBridge.getMusicVolumePct();
                    curMa = window.AndroidBridge.getBatteryCurrentMa();
                    voltMv = window.AndroidBridge.getBatteryVoltageMv();

                    const specRaw = window.AndroidBridge.getAudioSpectrumJson();
                    const spec = JSON.parse(specRaw);
                    playing = !!spec.playing;
                    visOk = !!spec.vis;
                    if (playing && visOk && spec.low >= 0) {
                      lowE = spec.low;
                      midE = Math.max(spec.mid, spec.rms * 0.9);
                      if (Array.isArray(spec.bins) && spec.bins.length === 24) {
                        bins = spec.bins;
                      }
                    } else if (playing) {
                      const t = Date.now() / 1000.0;
                      const beat = Math.pow((Math.sin(t * 6.8) + 1) / 2, 2.4);
                      lowE = 0.28 + 0.52 * beat + Math.random() * 0.08;
                      midE = 0.25 + 0.38 * Math.abs(Math.sin(t * 4.1)) + Math.random() * 0.08;
                      for (let i = 0; i < 24; i++) {
                        bins[i] = i < 6 ? lowE * (1 - i * 0.05) : midE * (0.9 - i * 0.02);
                      }
                    } else {
                      lowE = 0; midE = 0;
                      bins.fill(0.02);
                    }
                  } catch (e) {}
                }

                document.getElementById('volLabel').textContent = volPct + '% (' + step + '/' + maxStep + '格)';
                document.getElementById('curMa').textContent = curMa.toFixed(0);
                document.getElementById('voltMv').textContent = voltMv;

                const pBadge = document.getElementById('playStatusBadge');
                if (!playing || volPct === 0) {
                  pBadge.textContent = volPct === 0 ? '系統靜音 (0 mW)' : '音樂已暫停 (0 mW)';
                  pBadge.className = 'badge-warn';
                } else {
                  pBadge.textContent = visOk ? '🎵 全域頻譜即時捕捉中' : '🎵 偵測到外放音訊輸出中';
                  pBadge.className = 'badge-green';
                }

                drawFft(playing && volPct > 0);
                const pwr = computeAcousticModel(volPct, lowE, midE, playing);
                document.getElementById('totalMw').textContent = pwr.total;
                document.getElementById('topMw').textContent = pwr.top + ' mW';
                document.getElementById('subMw').textContent = pwr.sub + ' mW';
                document.getElementById('botMw').textContent = pwr.bot + ' mW';

                if (pwr.total > peakMw) peakMw = pwr.total;
                if (playing && volPct > 0) {
                  sumMw += pwr.total;
                  cntMw++;
                }
                document.getElementById('peakMw').textContent = peakMw + ' mW';
                document.getElementById('avgMw').textContent = (cntMw > 0 ? Math.round(sumMw / cntMw) : 0) + ' mW';

                if (curMa > 50) {
                  steadyHistory.push(curMa);
                  if (steadyHistory.length > 16) steadyHistory.shift();
                }
                const steadyBase = trimmedMean(steadyHistory);
                const fBadge = document.getElementById('pmicFilterBadge');

                if (baselineMa !== null && !autoTesting) {
                  const rawDelta = Math.max(0, curMa - baselineMa);
                  const maxPossibleSpeakerMa = (pwr.total / (voltMv / 1000.0)) * 1.45 + 45;
                  const inTouchCooldown = Date.now() < touchCooldownUntil;

                  if (inTouchCooldown || rawDelta > maxPossibleSpeakerMa) {
                    const cpuSpike = Math.max(0, Math.round(rawDelta - lastFilteredDeltaMa));
                    document.getElementById('cpuSpikeMa').textContent = '+' + cpuSpike + ' mA (已濾除)';
                    fBadge.textContent = inTouchCooldown ? '觸控降頻鎖定中' : '已攔截 CPU 突波';
                  } else {
                    lastFilteredDeltaMa = lastFilteredDeltaMa * 0.7 + rawDelta * 0.3;
                    document.getElementById('cpuSpikeMa').textContent = '0 mA (穩態)';
                    fBadge.textContent = 'PMIC 穩態追蹤中';
                  }
                  const cleanMw = (!playing || volPct === 0) ? 0 : Math.round(lastFilteredDeltaMa * (voltMv / 1000.0));
                  document.getElementById('diffMw').textContent = cleanMw + ' mW';
                } else {
                  const spike = Math.max(0, Math.round(curMa - steadyBase));
                  document.getElementById('cpuSpikeMa').textContent = spike > 120 ? ('+' + spike + ' mA (CPU波動)') : '穩態';
                }
              }, 160);
            </script>
          </body>
          </html>'''.strip())

          subprocess.check_call([aapt2, "compile", "--dir", "res", "-o", "res.zip"])
          subprocess.check_call([
              aapt2, "link", "-o", "unsigned.apk",
              "-I", android_jar,
              "--manifest", "AndroidManifest.xml",
              "-A", "assets",
              "--java", "gen",
              "res.zip"
          ])

          java_files = glob.glob("gen/**/*.java", recursive=True) + glob.glob("src/**/*.java", recursive=True)
          subprocess.check_call(["javac", "-source", "11", "-target", "11", "-cp", android_jar, "-d", "obj"] + java_files)

          class_files = glob.glob("obj/**/*.class", recursive=True)
          subprocess.check_call([d8, "--lib", android_jar, "--output", "."] + class_files)

          with zipfile.ZipFile("unsigned.apk", "a") as zf:
              zf.write("classes.dex", "classes.dex", compress_type=zipfile.ZIP_STORED)

          subprocess.check_call([zipalign, "-f", "-p", "4", "unsigned.apk", "aligned.apk"])
          subprocess.check_call([
              "keytool", "-genkeypair", "-v",
              "-keystore", "debug.keystore",
              "-storepass", "android",
              "-alias", "androiddebugkey",
              "-keypass", "android",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-dname", "CN=Android Debug,O=Android,C=US"
          ])
          out_apk = "dist/PocoF8Ultra-SpeakerPower-v2.apk"
          subprocess.check_call([
              apksigner, "sign",
              "--ks", "debug.keystore",
              "--ks-pass", "pass:android",
              "--key-pass", "pass:android",
              "--out", out_apk,
              "aligned.apk"
          ])
          subprocess.check_call([apksigner, "verify", "-v", out_apk])
          print("APK v2.0 successfully built and verified:", out_apk)
          PY

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF8Ultra-SpeakerPower-APK-v2
          path: dist/*.apk
