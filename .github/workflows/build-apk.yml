              </div>

              <canvas id="fftCanvas" width="320" height="56"></canvas>
              <div class="row-between" style="font-size:10px;color:#64748B;margin-top:4px;font-family:monospace;">
                <span>低頻 RMS (≤220Hz): <strong id="lowRmsTxt" style="color:#60A5FA;">0.0000</strong></span>
                <span>中高頻 RMS (>220Hz): <strong id="midRmsTxt" style="color:#FBBF24;">0.0000</strong></span>
              </div>
