              </div>

              <div class="stat-grid">
                <div class="stat-item">
                  <div class="stat-label">① 音樂暫停基準 (I_idle)</div>
                  <div class="stat-num" id="idleMaTxt" style="color:#94A3B8;">未紀錄</div>
                </div>
                <div class="stat-item">
                  <div class="stat-label">② 播放+EQ但0%靜音 (I_eq)</div>
                  <div class="stat-num" id="eqMuteMaTxt" style="color:#60A5FA;">未紀錄</div>
                </div>
                <div class="stat-item" style="border-color:rgba(96,165,250,0.35);">
                  <div class="stat-label">Poweramp EQ + 播放 CPU 功耗</div>
                  <div class="stat-num" id="eqPowerTxt" style="color:#60A5FA;">-- mW</div>
                </div>
                <div class="stat-item" style="border-color:rgba(255,212,0,0.45);">
                  <div class="stat-label">③ 純喇叭功放真實淨功耗</div>
                  <div class="stat-num" id="spkPowerTxt" style="color:#FFD400;font-size:15px;">-- mW</div>
                </div>
              </div>

              <div class="raw-box" id="rawDebugBox">
                PMIC Raw: -- uA (-- mA) | 電壓: -- mV | 10秒中位數: -- mA<br>
                最近8次原始採樣(mA): [--]
              </div>

              <div id="autoStatusText" style="font-size:11px;color:#FFD400;margin-top:6px;text-align:center;font-weight:700;display:none;"></div>

              <button id="btnAutoSpeaker">⚡ 1. 一鍵無UI實測「純喇叭功放功耗」(自動 0%↔當前音量)</button>
              <button id="btnRecordIdle" class="secondary">⏸ 2. 在「音樂暫停」時點此紀錄 I_idle (用來算 Poweramp EQ 耗電)</button>
            </div>

            <script>
              let idleMa = null;
              let eqMuteMa = null;
              let activePlayMa = null;
              let calFactor = 1.0;
              let rawHistory = [];
              let autoRunning = false;

              function median(arr) {
                if (!arr.length) return 0;
                const s = arr.slice().sort((a, b) => a - b);
                const mid = Math.floor(s.length / 2);
                return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2.0;
              }

              function drawBins(bins) {
                const c = document.getElementById('fftCanvas');
                if (!c) return;
                const ctx = c.getContext('2d');
                const w = c.width, h = c.height;
                ctx.clearRect(0, 0, w, h);
                const n = 24, gap = 2;
                const bw = (w - gap * (n - 1)) / n;
                for (let i = 0; i < n; i++) {
                  const v = (bins && bins[i]) ? bins[i] : 0.01;
                  const bh = Math.max(2, v * (h - 6));
                  ctx.fillStyle = i < 7 ? '#60A5FA' : '#FFD400';
                  ctx.fillRect(i * (bw + gap), h - bh, bw, bh);
                }
              }

              // Button 1: Automated Silent 0% vs Current Volume Test (Isolates Pure Speaker PA Power)
              document.getElementById('btnAutoSpeaker').addEventListener('click', () => {
                if (autoRunning) return;
                autoRunning = true;
                const statusEl = document.getElementById('autoStatusText');
                const btn = document.getElementById('btnAutoSpeaker');
                statusEl.style.display = 'block';
                btn.disabled = true;
                btn.style.opacity = '0.5';

                let savedStep = 11;
                let maxStep = 15;
                if (window.AndroidBridge) {
                  try {
                    const t = JSON.parse(window.AndroidBridge.getRealTelemetryJson());
                    savedStep = t.step > 0 ? t.step : 11;
                    maxStep = t.maxStep || 15;
                  } catch (e) {}
                }

                const muteArr = [];
                const playArr = [];
                const t0 = Date.now();

                const iv = setInterval(() => {
                  const sec = (Date.now() - t0) / 1000.0;
                  let cur = 0, volt = 3850;
                  if (window.AndroidBridge) {
                    try {
                      const t = JSON.parse(window.AndroidBridge.getRealTelemetryJson());
                      cur = t.curMa;
                      volt = t.voltMv;
                    } catch (e) {}
                  }

                  if (sec < 2.5) {
                    statusEl.textContent = '⏳ 階段 1/3：請勿觸碰螢幕，等待觸控 CPU 降頻穩定 (' + (2.5 - sec).toFixed(1) + 's)...';
                  } else if (sec < 7.5) {
                    statusEl.textContent = '🔇 階段 2/3：無UI背景靜音 (0%，Poweramp EQ 仍運算中) 採集 I_eq...';
                    if (window.AndroidBridge) {
                      try { window.AndroidBridge.setMusicVolumeSilent(0); } catch (e) {}
                    }
                    if (sec > 3.5 && cur > 10) muteArr.push(cur);
                  } else if (sec < 12.5) {
                    statusEl.textContent = '🔊 階段 3/3：無UI恢復外放音量，採集外放總電流 I_spk...';
                    if (window.AndroidBridge) {
                      try { window.AndroidBridge.setMusicVolumeSilent(savedStep); } catch (e) {}
                    }
                    if (sec > 8.5 && cur > 10) playArr.push(cur);
                  } else {
                    clearInterval(iv);
                    autoRunning = false;
                    btn.disabled = false;
                    btn.style.opacity = '1';

                    eqMuteMa = median(muteArr);
                    activePlayMa = median(playArr);
                    document.getElementById('eqMuteMaTxt').textContent = eqMuteMa.toFixed(1) + ' mA';

                    const deltaSpkMa = activePlayMa - eqMuteMa;
                    const spkMw = Math.round(deltaSpkMa * (volt / 1000.0));
                    document.getElementById('spkPowerTxt').textContent =
                      spkMw + ' mW (ΔI=' + (deltaSpkMa >= 0 ? '+' : '') + deltaSpkMa.toFixed(1) + 'mA)';
const curDispMw = parseFloat(document.getElementById('totalMw').textContent) || 200;
if (spkMw > 25 && curDispMw > 20) {
calFactor = Math.max(0.15, Math.min(3.0, (spkMw / (curDispMw / calFactor))));
document.getElementById('calLabel').textContent = calFactor.toFixed(2) + 'x';

                    if (idleMa !== null) {
                      const deltaEqMa = eqMuteMa - idleMa;
                      const eqMw = Math.round(deltaEqMa * (volt / 1000.0));
                      document.getElementById('eqPowerTxt').textContent =
                        eqMw + ' mW (ΔI=' + (deltaEqMa >= 0 ? '+' : '') + deltaEqMa.toFixed(1) + 'mA)';
                    }

                    statusEl.textContent =
                      '✅ 實測完成！0%靜音中位數=' + eqMuteMa.toFixed(1) + 'mA，外放中位數=' + activePlayMa.toFixed(1) + 'mA，純喇叭差值=' + spkMw + 'mW';
                  }
                }, 250);
              });

              // Button 2: Record Idle Current when Music is Paused (after 2.5s touch cooldown)
              document.getElementById('btnRecordIdle').addEventListener('click', () => {
                if (autoRunning) return;
                const statusEl = document.getElementById('autoStatusText');
                statusEl.style.display = 'block';
                const samples = [];
                const t0 = Date.now();
                const iv = setInterval(() => {
                  const sec = (Date.now() - t0) / 1000.0;
                  if (sec < 2.5) {
                    statusEl.textContent = '⏳ 手請離開螢幕，等待觸控降頻後紀錄音樂暫停電流 (' + (2.5 - sec).toFixed(1) + 's)...';
                  } else if (sec < 6.0) {
                    statusEl.textContent = '📏 正在採集音樂暫停基準電流 I_idle...';
                    if (window.AndroidBridge) {
                      try {
                        const t = JSON.parse(window.AndroidBridge.getRealTelemetryJson());
                        if (t.curMa > 10) samples.push(t.curMa);
                      } catch (e) {}
                    }
                  } else {
                    clearInterval(iv);
                    idleMa = median(samples);
                    document.getElementById('idleMaTxt').textContent = idleMa.toFixed(1) + ' mA';
                    if (eqMuteMa !== null && window.AndroidBridge) {
                      const volt = window.AndroidBridge.getBatteryVoltageMv();
                      const deltaEqMa = eqMuteMa - idleMa;
                      const eqMw = Math.round(deltaEqMa * (volt / 1000.0));
                      document.getElementById('eqPowerTxt').textContent =
                        eqMw + ' mW (ΔI=' + (deltaEqMa >= 0 ? '+' : '') + deltaEqMa.toFixed(1) + 'mA)';
                    }
                    statusEl.textContent = '✅ 已紀錄音樂暫停基準 I_idle = ' + idleMa.toFixed(1) + ' mA';
                  }
                }, 250);
              });

              // Live 200ms Real Sensor Poll (Zero Fake Math.sin!)
              setInterval(() => {
                if (!window.AndroidBridge) return;
                try {
                  const t = JSON.parse(window.AndroidBridge.getRealTelemetryJson());
                  document.getElementById('chgWarnBanner').style.display = t.chg ? 'block' : 'none';
                  document.getElementById('micSrcBadge').textContent = t.mic ? t.src : '無麥克風權限';
                  document.getElementById('dbBadge').textContent = t.db.toFixed(1) + ' dBFS';

                  const volPct = Math.round((t.step * 100.0) / Math.max(1, t.maxStep));
                  document.getElementById('volLabel').textContent = volPct + '% (' + t.step + '/' + t.maxStep + ')';
                  document.getElementById('lowRmsTxt').textContent = t.lowRms.toFixed(4);
                  document.getElementById('midRmsTxt').textContent = t.midRms.toFixed(4);

                  drawBins(t.bins);

                  // Real Acoustic Energy -> Power calculation (NO fake sine wave!)
                  // Only outputs wattage when music is active AND volume > 0 AND real acoustic signal > noise floor
                  if (!t.playing || t.step === 0 || (t.lowRms < 0.0008 && t.midRms < 0.0008)) {
                    document.getElementById('totalMw').textContent = '0';
                    document.getElementById('topMw').textContent = '0 mW';
                    document.getElementById('subMw').textContent = '0 mW';
                    document.getElementById('botMw').textContent = '0 mW';
                  } else {
                    const vNorm = t.step / Math.max(1.0, t.maxStep);
                    const paIdle = 42.0;
                    // Scale directly with measured 48kHz acoustic RMS (captures Poweramp EQ preamp & bass boost!)
                    const lowScale = Math.min(2.2, Math.pow(t.lowRms * 18.0, 0.85));
                    const midScale = Math.min(2.2, Math.pow(t.midRms * 22.0, 0.85));
                    const gainCurve = Math.pow(vNorm, 2.2);

                    const topMw = Math.round(((paIdle * 0.3) + 280.0 * gainCurve * (0.2 + midScale)) * calFactor);
                    const botMw = Math.round(((paIdle * 0.3) + 300.0 * gainCurve * (0.2 + midScale)) * calFactor);
                    const subMw = Math.round(((paIdle * 0.4) + 680.0 * gainCurve * (0.2 + lowScale)) * calFactor);
                    const totMw = topMw + botMw + subMw;

                    document.getElementById('totalMw').textContent = totMw;
                    document.getElementById('topMw').textContent = topMw + ' mW';
                    document.getElementById('subMw').textContent = subMw + ' mW';
                    document.getElementById('botMw').textContent = botMw + ' mW';
                  }

                  if (t.curMa > 0) {
                    const lastVal = rawHistory.length ? rawHistory[rawHistory.length - 1] : -1;
                    if (t.curMa !== lastVal) {
                      rawHistory.push(Number(t.curMa.toFixed(1)));
                      if (rawHistory.length > 8) rawHistory.shift();
                    }
                  }
                  const medMa = median(rawHistory);
                  document.getElementById('rawDebugBox').innerHTML =
                    'PMIC Raw: <strong>' + t.rawUa + '</strong> (' + t.curMa.toFixed(1) + ' mA) | 電壓: ' + t.voltMv + ' mV | 近期中位數: <strong style="color:#FFD400;">' + medMa.toFixed(1) + ' mA</strong><br>' +
                    '最近PMIC跳變紀錄(mA): [' + rawHistory.join(', ') + ']';
                } catch (e) {}
              }, 200);
            </script>
          </body>
          </html>'''.strip())

          subprocess.check_call([aapt2, "compile", "--dir", "res", "-o", "res.zip"])
          subprocess.check_call([
              aapt2, "link", "-o", "unsigned.apk",
              "-I", android_jar,
              "--manifest", "AndroidManifest.xml",
              "-A", "assets",
              "--java", "gen",
              "res.zip"
          ])

          java_files = glob.glob("gen/**/*.java", recursive=True) + glob.glob("src/**/*.java", recursive=True)
          subprocess.check_call(["javac", "-source", "11", "-target", "11", "-cp", android_jar, "-d", "obj"] + java_files)

          class_files = glob.glob("obj/**/*.class", recursive=True)
          subprocess.check_call([d8, "--lib", android_jar, "--output", "."] + class_files)

          with zipfile.ZipFile("unsigned.apk", "a") as zf:
              zf.write("classes.dex", "classes.dex", compress_type=zipfile.ZIP_STORED)

          subprocess.check_call([zipalign, "-f", "-p", "4", "unsigned.apk", "aligned.apk"])
          subprocess.check_call([
              "keytool", "-genkeypair", "-v",
              "-keystore", "debug.keystore",
              "-storepass", "android",
              "-alias", "androiddebugkey",
              "-keypass", "android",
              "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
              "-dname", "CN=Android Debug,O=Android,C=US"
          ])
          out_apk = "dist/PocoF8Ultra-SpeakerPower-4.ap"
          subprocess.check_call([
              apksigner, "sign",
              "--ks", "debug.keystore",
              "--ks-pass", "pass:android",
              "--key-pass", "pass:android",
              "--out", out_apk,
              "aligned.apk"
          ])
          subprocess.check_call([apksigner, "verify", "-v", out_apk])
          print("APK v3.0 successfully built and verified:", out_apk)
          PY

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocoF8Ultra-SpeakerPower-APK-v3
          path: dist/*.apk
